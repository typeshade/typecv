name: CI
# A pull request runs once, through `pull_request`; `push` runs only for main. A newer push to
# the same pull request cancels the run in progress, so only its latest head is checked.
#
# `changes` sorts the run: a change confined to `docs/` and Markdown files runs `docs` alone,
# which builds the site and checks the generated pages; any other change runs `check` and
# `webgpu`. A skipped job counts as passed for a required check.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # The files a pull request changes since it left its base, or the files a push to main
        # changed. A push whose previous head is unknown (all zeros) runs everything.
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE...$HEAD" > changed.txt
          elif [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            git diff --name-only "$BASE" "$HEAD" > changed.txt
          fi
          echo "Changed files:"
          cat changed.txt
          if grep -Ev '^(docs/|([^/]+/)*[^/]+\.md$)' changed.txt > code.txt; then
            echo "Code paths:"
            cat code.txt
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # After the build of `npm run check`: the declaration surface and the kernels' shader text
      # (docs/library-structure.md, section 5, phase 0).
      - run: npm run test:surface
      # The digest fixtures of tests/digests/ hold Node 22's bits: on 09894a7 this job's Node 24
      # entry found the two focal-search digests different, with equal traces (identity across
      # Node majors is not established; tests/typeshade/digest-fixture.mjs). So the fixtures are
      # compared on Node 22 only, and the digests job compares base and head on every major.
      - run: npm run test:digests
        if: matrix.node == 22
      - run: npm run example
      - run: npm run example:incremental
  webgpu-shard:
    # The WebGPU tests run in three shards. scripts/ci-shard.mjs assigns every file once, as
    # checked by tests/ci-shard.test.ts. `audit:typeshade` runs with the first shard.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    name: webgpu shard (${{ matrix.shard }}/${{ matrix.of }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { script: 'test:webgpu', shard: 1, of: 3 }
          - { script: 'test:webgpu', shard: 2, of: 3 }
          - { script: 'test:webgpu', shard: 3, of: 3 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build
      - run: node --test --test-concurrency=1 $(node scripts/ci-shard.mjs test:webgpu ${{ matrix.shard }} ${{ matrix.of }})
      - if: matrix.shard == 1
        run: npm run audit:typeshade
  webgpu:
    # The check that the ruleset names. It is green when every shard is green, red when one is
    # not, and skipped with the shards for a documentation-only change (a skipped job counts as
    # passed).
    needs: [changes, webgpu-shard]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.webgpu-shard.result }}" = "success"
  digests:
    # The compare job of docs/library-structure.md, section 5, phase 0, which section 4, rule 2
    # makes the gate of every structure phase on the GPU tiers: the characterization digests of
    # the merge base and of the head, made on one runner, must be equal. Identity across machines
    # is not established (Rule 1.2), so the job compares two runs of one runner and records no
    # WebGPU fixture.
    #
    # The digests are those of the CPU path (tests/digests/), of the CPU device and of WebGPU on
    # SwiftShader (tests/typeshade/sfm-digests*.test.mjs). Each run writes them to a directory
    # (TYPECV_DIGEST_OUT) and compares nothing itself. The job runs on every Node major of the
    # check job: the CPU-tier digests are not known to be equal across majors (on 09894a7 the
    # focal-search digests of Node 24 differed from Node 22's), so each major compares its own
    # base and head. On Node 24 both `node --test` steps run with `--single-threaded`, since two
    # scene digests were not deterministic within one process of V8 13.6 (docs/library-structure.md,
    # section 4, rule 2, amendment 3); each digest file records the flags of its process.
    #
    # The base runs the head's tests against the base's library: a worktree of the merge base gets
    # the head's tests/ and the base's build. So the job also works when the base has no digest
    # tests. A test file that the base cannot load (a module that the base does not have) or a case
    # that it cannot run is reported, not failed; scripts/compare-digests.mjs fails on a case whose
    # digests differ and on a file that only the base wrote. The job runs for pull requests.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DIGEST_NODE_FLAGS: ${{ matrix.node == 24 && '--single-threaded' || '' }}
      DIGEST_TESTS: >-
        tests/digests/cpu-scenes.test.ts tests/digests/scenes.test.ts
        tests/digests/south-building.test.ts tests/digests/gerrard-hall.test.ts
        tests/digests/person-hall.test.ts tests/digests/graham-hall.test.ts
        tests/typeshade/sfm-digests.test.mjs tests/typeshade/sfm-digests-south-building.test.mjs
        tests/typeshade/sfm-digests-gerrard-hall.test.mjs tests/typeshade/sfm-digests-person-hall.test.mjs
        tests/typeshade/sfm-digests-graham-hall.test.mjs tests/typeshade/sfm-digests-webgpu.test.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Digests of the head
        run: |
          set -euo pipefail
          npm run build
          TYPECV_DIGEST_OUT="$RUNNER_TEMP/digests/head" node $DIGEST_NODE_FLAGS --test $DIGEST_TESTS
      - name: Digests of the merge base, with the head's tests
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Merge base $base, head $HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          cd "$RUNNER_TEMP/base"
          rm -rf tests
          cp -R "$GITHUB_WORKSPACE/tests" tests
          if cmp -s package-lock.json "$GITHUB_WORKSPACE/package-lock.json"; then
            ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          else
            npm ci
            npx playwright install --only-shell chromium
          fi
          npm run build || echo "::warning::The merge base does not build; its device digests are reported as not run."
          TYPECV_DIGEST_OUT="$RUNNER_TEMP/digests/base" node $DIGEST_NODE_FLAGS --test $DIGEST_TESTS ||
            echo "::warning::A digest test failed on the merge base; its cases are reported as not run."
      - name: Compare the digests of the merge base and the head
        run: node scripts/compare-digests.mjs "$RUNNER_TEMP/digests/base" "$RUNNER_TEMP/digests/head"
  docs:
    # Documentation changes still receive the library build and declaration checks.
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
