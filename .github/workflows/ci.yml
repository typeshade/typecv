name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm --prefix website ci
      - run: npm run check
      - run: npm --prefix website run check
      - run: npm run build:website
      - run: npm run example
      - run: npm run example:incremental
  webgpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix website ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
      - run: npm run test:webgpu
      - run: npm run audit:typeshade
      - run: npm run build:website
      - run: npm run test:website
