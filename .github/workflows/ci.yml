name: CI
# A pull request runs once, through `pull_request`; `push` runs only for main. A newer push to
# the same pull request cancels the run in progress, so only its latest head is checked.
#
# `changes` sorts the run: a change confined to `docs/` and Markdown files runs `docs` alone,
# which builds the site and checks the generated pages; any other change runs `check` and
# `webgpu`. A skipped job counts as passed for a required check.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # The files a pull request changes since it left its base, or the files a push to main
        # changed. A push whose previous head is unknown (all zeros) runs everything.
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE...$HEAD" > changed.txt
          elif [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            git diff --name-only "$BASE" "$HEAD" > changed.txt
          fi
          echo "Changed files:"
          cat changed.txt
          if grep -Ev '^(docs/|([^/]+/)*[^/]+\.md$)' changed.txt > code.txt; then
            echo "Code paths:"
            cat code.txt
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm --prefix website ci
      - run: npm run check
      - run: npm --prefix website run check
      - run: npm run build:website
      - run: npm run example
      - run: npm run example:incremental
  webgpu:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix website ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build
      - run: npm run test:webgpu
      - run: npm run audit:typeshade
      - run: npm run build:website
      - run: npm run test:website
  docs:
    # The site renders `docs/*.md` and copies `docs/**/*.json`, so a documentation change still
    # builds the site and checks that every generated page links to real pages and anchors.
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix website ci
      - run: npm run build
      - run: npm run build:website
      - run: node --test --test-name-pattern='all generated pages' website/site.test.mjs
