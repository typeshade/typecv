name: Publish lab video samples
# Uploads original videos and display-only thumbnails from website/samples/remote-videos.json
# to the R2 bucket that the site's Worker serves under /sample/.
# Run it once after a sample is added to the manifest, or with `only` to redo some of them, or
# with `parts` to upload only the thumbnails or only the source videos. A source video that differs
# from the SHA-256 in the manifest stops the run.
on:
  workflow_dispatch:
    inputs:
      only:
        description: Sample ids to publish, comma-separated (empty for all)
        default: ''
        required: false
      parts:
        description: What to upload (all, videos-only or thumbnails-only)
        type: choice
        options: [all, videos-only, thumbnails-only]
        default: all

permissions:
  contents: read

concurrency:
  group: typecv-lab-samples
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Make sure the bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler r2 bucket list | grep -q 'typecv-samples' || npx wrangler r2 bucket create typecv-samples
      - name: Upload original videos and preview thumbnails
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
          PARTS: ${{ github.event.inputs.parts }}
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$PARTS" = videos-only ] || [ "$PARTS" = thumbnails-only ]; then args+=("--$PARTS"); fi
          node scripts/lab-remote-samples.mjs publish "${args[@]}"
