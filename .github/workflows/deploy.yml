name: Deploy public website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecv-site-production
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare
      url: https://cv.typeshade.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix website ci
      - run: npm run build
      - run: npm run build:website
      - name: Deploy public static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN Actions secret; this run builds the site but does not deploy it. Configure the secret to enable automatic deployment."
            exit 0
          fi
          npm run deploy:website
